<load target="css/member.css" />
<load target="js/member.js" />

<!--// XE3 스타일 마이페이지 셸: 좌측 프로필+세로 내비, 우측 컨텐츠. 모바일에선 상단 칩 내비로 변형 -->
<section class="xm zmy">
<div class="zmy-wrap">
	<aside class="zmy-side" cond="$is_logged && $logged_info->menu_list && (!isset($member_srl) || !$member_srl || $member_srl == $logged_info->member_srl)">
		<div class="zmy-profile">
			<span class="zmy-avatar">
				<img src="{$logged_info->profile_image->src}" alt="" cond="!empty($logged_info->profile_image->src)" />
				<em cond="empty($logged_info->profile_image->src)">{mb_substr($logged_info->nick_name ?? '', 0, 1)}</em>
			</span>
			<strong class="zmy-nick">{$logged_info->nick_name}</strong>
			<span class="zmy-email">{$logged_info->email_address}</span>
		</div>
		<nav class="zmy-nav">
			<ul>
				<li loop="$logged_info->menu_list=>$key,$val" class="active"|cond="$key==$act">
					<a href="{getUrl('', 'act', $key, 'mid', $mid)}">{lang($val)}</a>
				</li>
			</ul>
		</nav>
	</aside>
	<div class="zmy-content">
