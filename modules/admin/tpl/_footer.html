<config autoescape="on" />

	</div>
	<!-- /BODY -->
	<footer class="footer" cond="$this->user->isAdmin()">
		<p class="power">
			Powered by <strong>Zittme {\ZITTME_VERSION}</strong>
			<!--@if(isset($released_version))-->
				<span class="vr">|</span> Latest engine: <a href="{$download_link}" target="_blank">{$released_version}</a>
			<!--@end-->
		</p>
		<p class="cache">
			<button type="button" class="x_btn-link" onclick="doResetAdminMenu();">{lang('admin.cmd_admin_menu_reset')}</button> <span class="vr">|</span>
			<button type="button" class="x_btn-link" onclick="doRecompileCacheFile();">{lang('common.cmd_remake_cache')}</button> <span class="vr">|</span>
			<button type="button" class="x_btn-link" onclick="doClearSession();">{lang('admin.cmd_clear_session')}</button> <span class="vr">|</span>
			<a href="./index.php?module=admin&act=dispAdminCleanupList" style="vertical-align:middle">{lang('admin.cmd_cleanup_core_files')}</a> <span class="vr">|</span>
			<a href="./index.php?module=admin&act=dispAdminViewServerEnv" style="vertical-align:middle">{lang('admin.cmd_view_server_env')}</a> <span class="vr">|</span>
			<a href="https://zitt.me/issue" target="_blank" style="vertical-align:middle">{lang('admin.bug_report')}</a>
		</p>
		<p class="theme-switch" role="group" aria-label="Theme">
			<button type="button" class="x_btn-link" data-zm-theme-set="auto">{$lang->theme_auto ?? 'Auto'}</button> <span class="vr">|</span>
			<button type="button" class="x_btn-link" data-zm-theme-set="light">{$lang->theme_light ?? 'Light'}</button> <span class="vr">|</span>
			<button type="button" class="x_btn-link" data-zm-theme-set="dark">{$lang->theme_dark ?? 'Dark'}</button>
		</p>
		<p class="goto">
			<a href="{getUrl('')}" target="_blank" class="goto-site"><i class="xi xi-external-link"></i> {$lang->goto_my_site ?? '내 사이트 바로가기'}</a>
		</p>
		<script>
		jQuery(function($){
			function mark(){
				var cur = 'auto';
				try { cur = localStorage.getItem('zm-admin-theme') || 'auto'; } catch(e) {}
				$('[data-zm-theme-set]').css('font-weight','normal').css('color','');
				$('[data-zm-theme-set="' + cur + '"]').css('font-weight','700').css('color','var(--zm-brand)');
			}
			$('[data-zm-theme-set]').on('click', function(){
				var v = $(this).data('zm-theme-set');
				try {
					if (v === 'auto') { localStorage.removeItem('zm-admin-theme'); document.documentElement.removeAttribute('data-zm-theme'); }
					else { localStorage.setItem('zm-admin-theme', v); document.documentElement.setAttribute('data-zm-theme', v); }
				} catch(e) {}
				mark();
			});
			mark();
		});
		</script>
		<load target="../../session/tpl/js/session.js" />
	</footer>
</div>
<load target="./js/config.js" />
